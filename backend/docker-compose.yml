# Déploiement Dokploy (Application → Docker Compose)
# Contexte = dossier backend/ (ce fichier + Dockerfile).
#
# Variables obligatoires dans Dokploy (Environment) :
#   DATABASE_URL=postgresql://USER:PASSWORD@HOST:PORT/DB
#   REDIS_URL=redis://redis:6379/0
#
# Le service redis est inclus ; pointer REDIS_URL vers le hostname "redis".

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MEDIA_DIR: ${MEDIA_DIR:-media}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_FILE: ${APPLE_PRIVATE_KEY_FILE:-}
      APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-production}
      # Revenus en plus des pièces : voir .env.example.
      FEATURE_REWARDED_ADS: ${FEATURE_REWARDED_ADS:-false}
      REWARDED_AD_COINS: ${REWARDED_AD_COINS:-5}
      REWARDED_ADS_PER_DAY: ${REWARDED_ADS_PER_DAY:-10}
      REWARDED_ADS_TRUST_CLIENT: ${REWARDED_ADS_TRUST_CLIENT:-false}
      FEATURE_INTERSTITIAL_ADS: ${FEATURE_INTERSTITIAL_ADS:-false}
      INTERSTITIAL_EVERY_GAMES: ${INTERSTITIAL_EVERY_GAMES:-3}
      FEATURE_REMOVE_ADS: ${FEATURE_REMOVE_ADS:-false}
      FEATURE_SUBSCRIPTION: ${FEATURE_SUBSCRIPTION:-false}
      PASS_DAILY_COINS: ${PASS_DAILY_COINS:-20}
      PASS_BONUS_HINTS: ${PASS_BONUS_HINTS:-2}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/code/media

volumes:
  redis_data:
  media_data:
