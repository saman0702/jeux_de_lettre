    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: release/*
          include: true
          source: true
      cancel_previous_builds: true

    when:
      changeset:
        includes:
          - mobile/katian_driver_app/
          - codemagic.yaml

    scripts:
      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR/mobile/katian_driver_app"
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/mobile/katian_driver_app/ios"
