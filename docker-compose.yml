name: letterbattle

services:
  postgres:
    image: postgres:17-alpine
    container_name: letterbattle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: letterbattle-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: letterbattle-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Boutique (voir docs/BOUTIQUE.md) : fichiers de clés dans ./secrets.
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_FILE: ${APPLE_PRIVATE_KEY_FILE:-}
      APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-sandbox}
      AGORA_APP_ID: ${AGORA_APP_ID:-}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      # Revenus en plus des pièces : voir .env.example.
      FEATURE_REWARDED_ADS: ${FEATURE_REWARDED_ADS:-false}
      REWARDED_AD_COINS: ${REWARDED_AD_COINS:-5}
      REWARDED_ADS_PER_DAY: ${REWARDED_ADS_PER_DAY:-10}
      REWARDED_ADS_TRUST_CLIENT: ${REWARDED_ADS_TRUST_CLIENT:-false}
      FEATURE_INTERSTITIAL_ADS: ${FEATURE_INTERSTITIAL_ADS:-false}
      INTERSTITIAL_EVERY_GAMES: ${INTERSTITIAL_EVERY_GAMES:-3}
      FEATURE_REMOVE_ADS: ${FEATURE_REMOVE_ADS:-false}
      FEATURE_SUBSCRIPTION: ${FEATURE_SUBSCRIPTION:-false}
      PASS_DAILY_COINS: ${PASS_DAILY_COINS:-20}
      PASS_BONUS_HINTS: ${PASS_BONUS_HINTS:-2}
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/migrations:/code/migrations
      - avatars_data:/code/media
      - ./secrets:/code/secrets:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  avatars_data:
